<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş-Çıxış Sistemi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background-color: #a0a0a0; cursor: not-allowed; }
        .user-info { font-size: 14px; color: #666; margin-bottom: 15px; }

        /* Yuxarıda çıxan toast bildirişi */
        .toast {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%) translateY(-120px);
            padding: 14px 32px; border-radius: 10px; color: #fff;
            font-size: 17px; font-weight: bold; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 1000; opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h2>QR Giriş/Çıxış</h2>

    <div id="setup-form" style="display: none;">
        <p>Sistemə ilk dəfə daxil olursunuz. Lütfən adınızı qeyd edin:</p>
        <div class="input-group">
            <label for="fullName">Ad və Soyad:</label>
            <input type="text" id="fullName" placeholder="Məs: Əli Əliyev">
        </div>
        <button id="confirm-btn" onclick="saveUser()" disabled>Təsdiqlə və Qeydiyyatı Et</button>
    </div>

    <div id="checkin-container" style="display: none;">
        <div class="user-info" id="user-display"></div>
        <button id="scan-btn" onclick="processScan()">Giriş / Çıxış Et</button>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">
            <a href="#" onclick="resetUser()" style="color: #888;">Adı dəyişdir</a>
        </p>
    </div>
</div>

<!-- Yuxarıda çıxan toast bildirişi -->
<div id="toast" class="toast">
    <span id="toast-message"></span>
</div>

<script>
    // 1. Cihaz ID-sini yoxla və ya yarat
    let deviceId = localStorage.getItem('device_uuid');
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
        localStorage.setItem('device_uuid', deviceId);
    }

    let userName = localStorage.getItem('user_name');

    window.onload = function() {
        const nameInput = document.getElementById('fullName');
        const confirmBtn = document.getElementById('confirm-btn');

        // Input boş olduqda button disabled qalsın
        nameInput.addEventListener('input', function() {
            confirmBtn.disabled = this.value.trim().length === 0;
        });

        if (!userName) {
            document.getElementById('setup-form').style.display = 'block';
            nameInput.focus();
        } else {
            showCheckinUI();
        }
    };

    let toastTimer = null;

    function showAlert(message, type) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').innerText = message;
        toast.className = 'toast toast-' + type;
        void toast.offsetWidth; // transition-i yenidən başlatmaq üçün
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(closeAlert, 1000);
    }

    function closeAlert() {
        document.getElementById('toast').classList.remove('show');
    }

    function saveUser() {
        const nameInput = document.getElementById('fullName').value.trim();
        if (!nameInput) return;
        userName = nameInput;
        localStorage.setItem('user_name', userName);
        document.getElementById('setup-form').style.display = 'none';
        showCheckinUI();
        processScan();
    }

    function showCheckinUI() {
        document.getElementById('checkin-container').style.display = 'block';
        document.getElementById('user-display').innerText = 'Xoş gəldiniz, ' + userName;
    }

    function resetUser() {
        if (confirm('Adınızı dəyişmək istədiyinizdən əminsiniz?')) {
            localStorage.removeItem('user_name');
            location.reload();
        }
    }

    async function processScan() {
        const btn = document.getElementById('scan-btn');

        btn.disabled = true;
        btn.innerText = 'Göndərilir...';

        try {
            const response = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, userName })
            });

            const data = await response.json();

            if (data.success) {
                if (data.status === 'IN') {
                    showAlert('Giriş Uğurludur', 'success');
                } else {
                    showAlert('Çıxış uğurludur', 'error');
                }
            } else {
                showAlert('Xəta: ' + data.message, 'error');
            }
        } catch (err) {
            showAlert('Serverlə əlaqə saxlanıla bilmədi.', 'error');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Giriş / Çıxış Et';
        }
    }
</script>

</body>
</html>
