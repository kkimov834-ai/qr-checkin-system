<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş-Çıxış Sistemi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background-color: #a0a0a0; cursor: not-allowed; }
        .user-info { font-size: 14px; color: #666; margin-bottom: 15px; }

        /* Xüsusi alert (popup) */
        .alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.55);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .alert-box {
            padding: 28px 34px; border-radius: 14px; color: #fff;
            font-size: 20px; font-weight: bold; text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35); min-width: 290px;
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .alert-success { background-color: #28a745; }
        .alert-error { background-color: #dc3545; }
        .alert-box button {
            margin-top: 18px; width: auto; padding: 9px 32px;
            background-color: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.65);
            color: #fff; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .alert-box button:hover { background-color: rgba(255,255,255,0.35); }
    </style>
</head>
<body>

<div class="card">
    <h2>QR Giriş/Çıxış</h2>

    <div id="setup-form" style="display: none;">
        <p>Sistemə ilk dəfə daxil olursunuz. Lütfən adınızı qeyd edin:</p>
        <div class="input-group">
            <label for="fullName">Ad və Soyad:</label>
            <input type="text" id="fullName" placeholder="Məs: Əli Əliyev">
        </div>
        <button id="confirm-btn" onclick="saveUser()" disabled>Təsdiqlə və Qeydiyyatı Et</button>
    </div>

    <div id="checkin-container" style="display: none;">
        <div class="user-info" id="user-display"></div>
        <button id="scan-btn" onclick="processScan()">Giriş / Çıxış Et</button>
        <p style="font-size: 12px; color: #888; margin-top: 10px;">
            <a href="#" onclick="resetUser()" style="color: #888;">Adı dəyişdir</a>
        </p>
    </div>
</div>

<!-- Xüsusi alert popup -->
<div id="alert-overlay" class="alert-overlay" onclick="if(event.target === this) closeAlert()">
    <div id="alert-box" class="alert-box">
        <div id="alert-message"></div>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>

<script>
    // 1. Cihaz ID-sini yoxla və ya yarat
    let deviceId = localStorage.getItem('device_uuid');
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
        localStorage.setItem('device_uuid', deviceId);
    }

    let userName = localStorage.getItem('user_name');

    window.onload = function() {
        const nameInput = document.getElementById('fullName');
        const confirmBtn = document.getElementById('confirm-btn');

        // Input boş olduqda button disabled qalsın
        nameInput.addEventListener('input', function() {
            confirmBtn.disabled = this.value.trim().length === 0;
        });

        if (!userName) {
            document.getElementById('setup-form').style.display = 'block';
            nameInput.focus();
        } else {
            showCheckinUI();
        }
    };

    function showAlert(message, type) {
        const overlay = document.getElementById('alert-overlay');
        const box = document.getElementById('alert-box');
        document.getElementById('alert-message').innerText = message;
        box.className = 'alert-box ' + (type === 'success' ? 'alert-success' : 'alert-error');
        overlay.style.display = 'flex';
    }

    function closeAlert() {
        document.getElementById('alert-overlay').style.display = 'none';
    }

    function saveUser() {
        const nameInput = document.getElementById('fullName').value.trim();
        if (!nameInput) return;
        userName = nameInput;
        localStorage.setItem('user_name', userName);
        document.getElementById('setup-form').style.display = 'none';
        showCheckinUI();
        processScan();
    }

    function showCheckinUI() {
        document.getElementById('checkin-container').style.display = 'block';
        document.getElementById('user-display').innerText = 'Xoş gəldiniz, ' + userName;
    }

    function resetUser() {
        if (confirm('Adınızı dəyişmək istədiyinizdən əminsiniz?')) {
            localStorage.removeItem('user_name');
            location.reload();
        }
    }

    async function processScan() {
        const btn = document.getElementById('scan-btn');

        btn.disabled = true;
        btn.innerText = 'Göndərilir...';

        try {
            const response = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, userName })
            });

            const data = await response.json();

            if (data.success) {
                if (data.status === 'IN') {
                    showAlert('Giriş Uğurludur', 'success');
                } else {
                    showAlert('Çıxış uğurludur', 'error');
                }
            } else {
                showAlert('Xəta: ' + data.message, 'error');
            }
        } catch (err) {
            showAlert('Serverlə əlaqə saxlanıla bilmədi.', 'error');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Giriş / Çıxış Et';
        }
    }
</script>

</body>
</html>
